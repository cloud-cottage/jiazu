worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;

  # ---- 上游服务 ----
  upstream gramps_backend {
    server gramps-web:5000;
  }

  # ---- 聚合首页 + Vue 外壳 ----
  server {
    listen 80;
    server_name jiazutong.cn;

    # Vue SPA 静态资源
    root /usr/share/nginx/html;
    index index.html;

    # API 代理 → Gramps-Web
    location /api/ {
      proxy_pass http://gramps_backend/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 回退
    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  # ---- 自定义子域名（泛解析） ----
  # 每个 *.jiazutong.cn 子域名由 Nginx 变量提取，
  # 通过 lua 或 njs 读取 tree-meta.json 映射到对应 tree_id
  # 简化版：直接代理 Vue 外壳，由前端根据 hostname 查 meta 配置

  server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.jiazutong\.cn$;

    root /usr/share/nginx/html;
    index index.html;

    # 将子域名通过 header 传给 Vue 外壳
    location / {
      proxy_set_header X-Tree-Domain $subdomain;
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://gramps_backend/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # ---- 管理后台（透传 Gramps-Web 原生界面） ----
  server {
    listen 80;
    server_name admin.jiazutong.cn;

    location / {
      proxy_pass http://gramps_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # ---- CDN 媒体域名（生产环境由 CDN 直接回源 COS，此处为兜底） ----
  server {
    listen 80;
    server_name media.jiazutong.cn;

    location / {
      # 生产环境：此域名走腾讯云 CDN 直接回源 COS
      # 此处返回 410 防止直接访问源站
      return 410;
    }
  }
}
