# Gramps-Web 本地开发配置
# 生产环境使用 docker-compose.yml 中的环境变量

# 多 Tree 模式
TREE="*"

# 安全（生产环境务必更换）
SECRET_KEY="dev-only-secret-key-do-not-use-in-prod"

# 用户数据库
USER_DB_URI="sqlite:////Users/kevin/bistro/jiazu/gramps_db/users.sqlite"

# 媒体目录（本地开发；生产走 COS s3://）
MEDIA_BASE_DIR="/Users/kevin/bistro/jiazu/gramps_media"

# 多 Tree 媒体隔离
MEDIA_PREFIX_TREE=True

# 新建 tree 默认 SQLite 后端
NEW_DB_BACKEND="sqlite"

# 关闭公网注册（合规要求）
REGISTRATION_DISABLED=True

# CORS（本地开发放开，生产收紧到具体域名）
CORS_ORIGINS="*"

# 日志
LOG_LEVEL="INFO"
